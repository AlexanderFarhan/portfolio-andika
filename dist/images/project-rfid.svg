<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="rfidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e2b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#rfidBg)" rx="16" />

  <!-- Circuit Trace Lines -->
  <g opacity="0.3" stroke="#34d399" stroke-width="2" fill="none">
    <path d="M50 180 L180 180 L220 220 L300 220" />
    <path d="M120 50 L120 120 L160 160" />
    <path d="M480 300 L400 300 L360 260 L360 180" />
    <circle cx="50" cy="180" r="4" fill="#34d399" />
    <circle cx="120" cy="50" r="4" fill="#34d399" />
    <circle cx="480" cy="300" r="4" fill="#34d399" />
  </g>

  <!-- ESP32 Development Board -->
  <g transform="translate(60, 70)">
    <rect width="180" height="220" rx="10" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="2" />
    <!-- Header pins left -->
    <g fill="#94a3b8">
      <rect x="5" y="20" width="8" height="6" rx="1" />
      <rect x="5" y="35" width="8" height="6" rx="1" />
      <rect x="5" y="50" width="8" height="6" rx="1" />
      <rect x="5" y="65" width="8" height="6" rx="1" />
      <rect x="5" y="80" width="8" height="6" rx="1" />
      <rect x="5" y="95" width="8" height="6" rx="1" />
      <rect x="5" y="110" width="8" height="6" rx="1" />
      <rect x="5" y="125" width="8" height="6" rx="1" />
      <rect x="5" y="140" width="8" height="6" rx="1" />
      <rect x="5" y="155" width="8" height="6" rx="1" />
      <rect x="5" y="170" width="8" height="6" rx="1" />
      <rect x="5" y="185" width="8" height="6" rx="1" />
    </g>
    <!-- Header pins right -->
    <g fill="#94a3b8" transform="translate(162, 0)">
      <rect x="5" y="20" width="8" height="6" rx="1" />
      <rect x="5" y="35" width="8" height="6" rx="1" />
      <rect x="5" y="50" width="8" height="6" rx="1" />
      <rect x="5" y="65" width="8" height="6" rx="1" />
      <rect x="5" y="80" width="8" height="6" rx="1" />
      <rect x="5" y="95" width="8" height="6" rx="1" />
      <rect x="5" y="110" width="8" height="6" rx="1" />
      <rect x="5" y="125" width="8" height="6" rx="1" />
      <rect x="5" y="140" width="8" height="6" rx="1" />
      <rect x="5" y="155" width="8" height="6" rx="1" />
      <rect x="5" y="170" width="8" height="6" rx="1" />
      <rect x="5" y="185" width="8" height="6" rx="1" />
    </g>
    <!-- Metal Shield / Antenna -->
    <rect x="35" y="15" width="110" height="70" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    <text x="90" y="50" fill="#1e293b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>
    <text x="90" y="65" fill="#475569" font-family="sans-serif" font-size="9" text-anchor="middle">WiFi + BT 4.2</text>

    <!-- Microcontroller Chip -->
    <rect x="50" y="105" width="80" height="80" rx="4" fill="url(#chipGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="90" y="145" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MCU CORE</text>
    <text x="90" y="160" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">240MHz Tensilica</text>
  </g>

  <!-- Waves WiFi / Radio Signal -->
  <g transform="translate(255, 170)" stroke="#10b981" stroke-width="2.5" fill="none">
    <path d="M0 -30 A 40 40 0 0 1 0 30" opacity="0.4" />
    <path d="M15 -45 A 60 60 0 0 1 15 45" opacity="0.7" />
    <path d="M30 -60 A 80 80 0 0 1 30 60" />
  </g>

  <!-- RFID Card Reader Module RC522 -->
  <g transform="translate(330, 85)">
    <rect width="210" height="190" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    
    <!-- RFID Coil Icon -->
    <rect x="25" y="20" width="160" height="75" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="105" y="55" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RC522 RFID 13.56 MHz</text>
    <text x="105" y="72" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">UID: 9A 4B 88 E1 [OK]</text>

    <!-- Success Feedback Badge -->
    <rect x="25" y="110" width="160" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <circle cx="50" cy="138" r="14" fill="#10b981" />
    <path d="M44 138 L48 142 L56 133" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="75" y="134" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Presensi Tercatat</text>
    <text x="75" y="148" fill="#a7f3d0" font-family="sans-serif" font-size="9">Synced to Laravel API</text>
  </g>
</svg>
