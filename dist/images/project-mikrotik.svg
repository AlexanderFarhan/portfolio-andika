<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#netBg)" rx="16" />

  <!-- Network Map Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <circle cx="300" cy="180" r="80" fill="none" stroke-dasharray="4 4" />
    <circle cx="300" cy="180" r="140" fill="none" stroke-dasharray="4 4" />
  </g>

  <!-- Central MikroTik Core Router -->
  <g transform="translate(220, 140)">
    <rect width="160" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Ports -->
    <g fill="#0f172a" stroke="#64748b" stroke-width="1">
      <rect x="15" y="45" width="18" height="18" rx="2" />
      <rect x="40" y="45" width="18" height="18" rx="2" />
      <rect x="65" y="45" width="18" height="18" rx="2" />
      <rect x="90" y="45" width="18" height="18" rx="2" />
      <rect x="115" y="45" width="18" height="18" rx="2" />
    </g>
    <!-- Port LED indicators -->
    <circle cx="24" cy="40" r="3" fill="#10b981" />
    <circle cx="49" cy="40" r="3" fill="#10b981" />
    <circle cx="74" cy="40" r="3" fill="#10b981" />
    <circle cx="99" cy="40" r="3" fill="#10b981" />
    <circle cx="124" cy="40" r="3" fill="#38bdf8" />
    <text x="80" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MikroTik CCR / RB</text>
  </g>

  <!-- Internet Cloud Top -->
  <g transform="translate(230, 25)">
    <rect width="140" height="50" rx="25" fill="#0284c7" opacity="0.8" />
    <text x="70" y="30" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WAN / Internet</text>
  </g>
  <line x1="300" y1="75" x2="300" y2="140" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- VLAN 10 (Management) Bottom Left -->
  <g transform="translate(50, 250)">
    <rect width="140" height="75" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="70" y="28" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VLAN 10: Management</text>
    <text x="70" y="46" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">192.168.10.0/24</text>
    <text x="70" y="60" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">✓ Isolated &amp; Secure</text>
  </g>
  <line x1="120" y1="250" x2="240" y2="220" stroke="#818cf8" stroke-width="2" />

  <!-- VLAN 20 (Staff & Workstations) Bottom Center -->
  <g transform="translate(230, 260)">
    <rect width="140" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="70" y="28" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VLAN 20: Staff PC</text>
    <text x="70" y="46" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">192.168.20.0/24</text>
    <text x="70" y="60" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle">QoS: Simple Queue</text>
  </g>
  <line x1="300" y1="260" x2="300" y2="220" stroke="#10b981" stroke-width="2" />

  <!-- VLAN 30 (Guest Hotspot) Bottom Right -->
  <g transform="translate(410, 250)">
    <rect width="140" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="70" y="28" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VLAN 30: Guest WiFi</text>
    <text x="70" y="46" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">10.10.30.0/24</text>
    <text x="70" y="60" fill="#f59e0b" font-family="sans-serif" font-size="9" text-anchor="middle">Captive Portal Active</text>
  </g>
  <line x1="480" y1="250" x2="360" y2="220" stroke="#f59e0b" stroke-width="2" />

  <!-- Firewall Shield Top Right -->
  <g transform="translate(460, 40)">
    <rect width="105" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <text x="52" y="20" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NAT &amp; FIREWALL</text>
    <text x="52" y="34" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Drop Invalid: ON</text>
  </g>
</svg>
