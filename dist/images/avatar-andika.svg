<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#avatarBg)" rx="30" />
  
  <!-- Subtle Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
  </g>

  <!-- Circular Glow Halo -->
  <circle cx="200" cy="180" r="130" fill="url(#accentGlow)" opacity="0.25" filter="blur(20px)" />
  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#accentGlow)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Shoulders & Outfit -->
  <path d="M100 370 C100 290 140 270 200 270 C260 270 300 290 300 370 Z" fill="url(#jacketGrad)" />
  <!-- Shirt collar -->
  <polygon points="175,270 200,320 225,270" fill="#38bdf8" opacity="0.9" />
  <polygon points="188,270 200,305 212,270" fill="#ffffff" />

  <!-- Neck -->
  <rect x="182" y="225" width="36" height="50" rx="6" fill="#f59e0b" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M142 165 C140 115 170 100 200 100 C235 100 258 115 258 165 C250 135 235 125 200 125 C165 125 148 140 142 165 Z" fill="#1e1b4b" />

  <!-- Ears -->
  <ellipse cx="144" cy="180" rx="8" ry="12" fill="#f59e0b" />
  <ellipse cx="256" cy="180" rx="8" ry="12" fill="#f59e0b" />

  <!-- Modern Glasses -->
  <rect x="156" y="165" width="36" height="24" rx="6" fill="none" stroke="#0ea5e9" stroke-width="3.5" />
  <rect x="208" y="165" width="36" height="24" rx="6" fill="none" stroke="#0ea5e9" stroke-width="3.5" />
  <line x1="192" y1="177" x2="208" y2="177" stroke="#0ea5e9" stroke-width="3" />
  <!-- Glass lens reflection -->
  <line x1="162" y1="183" x2="182" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />
  <line x1="214" y1="183" x2="234" y2="170" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M185 210 Q200 222 215 210" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

  <!-- Tech Floating Tags -->
  <g transform="translate(45, 110)">
    <rect width="80" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="40" y="18" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;Laravel/&gt;</text>
  </g>
  <g transform="translate(275, 120)">
    <rect width="85" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="42" y="18" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">MikroTik</text>
  </g>
  <g transform="translate(50, 290)">
    <rect width="85" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="42" y="18" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ESP32 IoT</text>
  </g>
</svg>
