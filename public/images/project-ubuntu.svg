<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b1e" />
      <stop offset="100%" stop-color="#090510" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#termBg)" rx="16" />

  <!-- Terminal Window Shell -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="#0c0714" stroke="#77216f" stroke-width="2" />
  
  <!-- Terminal Top Bar -->
  <rect x="25" y="25" width="550" height="42" rx="12" fill="#200d27" />
  <circle cx="50" cy="46" r="6" fill="#e95420" />
  <circle cx="68" cy="46" r="6" fill="#f59e0b" />
  <circle cx="86" cy="46" r="6" fill="#10b981" />
  <text x="300" y="50" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">andika@ubuntu-srv-01:~ (Ubuntu 22.04 LTS)</text>
  <line x1="25" y1="67" x2="575" y2="67" stroke="#3c1b40" stroke-width="1" />

  <!-- Terminal Commands & Logs -->
  <g transform="translate(45, 95)" font-family="monospace" font-size="12">
    <!-- Prompt 1 -->
    <text x="0" y="0" fill="#e95420" font-weight="bold">andika@srv:~$</text>
    <text x="110" y="0" fill="#f8fafc">sudo systemctl status nginx mysql fail2ban</text>

    <!-- Status Output -->
    <text x="0" y="25" fill="#4ade80">● nginx.service - A high performance web server and a reverse proxy</text>
    <text x="20" y="42" fill="#94a3b8">Active: <tspan fill="#4ade80">active (running)</tspan> since Tue 2026-10-06 18:22:10 UTC</text>
    
    <text x="0" y="68" fill="#4ade80">● mysql.service - MySQL Community Server</text>
    <text x="20" y="85" fill="#94a3b8">Active: <tspan fill="#4ade80">active (running)</tspan> [InnoDB Buffer Pool 100% warm]</text>

    <!-- Prompt 2 -->
    <text x="0" y="118" fill="#e95420" font-weight="bold">andika@srv:~$</text>
    <text x="110" y="118" fill="#f8fafc">./deploy-automation.sh --backup-and-sync</text>

    <text x="0" y="142" fill="#38bdf8">[INFO] 2026-10-06 23:00:01 - Starting automated MySQL dump...</text>
    <text x="0" y="162" fill="#38bdf8">[INFO] DB backup created: /var/backups/db_backup_prod.sql.gz [48MB]</text>
    <text x="0" y="182" fill="#38bdf8">[INFO] Syncing encrypted archive to remote backup server... OK (200)</text>
    <text x="0" y="202" fill="#a855f7">[SEC] Fail2ban: 0 banned IPs detected. UFW firewall active (allow 80,443,2222).</text>

    <!-- Active cursor -->
    <text x="0" y="226" fill="#e95420" font-weight="bold">andika@srv:~$</text>
    <rect x="112" y="215" width="8" height="15" fill="#e95420" />
  </g>
</svg>
