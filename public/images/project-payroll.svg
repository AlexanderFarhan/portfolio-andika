<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="payBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#payBg)" rx="16" />

  <!-- App Window Header -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="50" cy="48" r="6" fill="#ef4444" />
  <circle cx="68" cy="48" r="6" fill="#f59e0b" />
  <circle cx="86" cy="48" r="6" fill="#10b981" />
  <text x="110" y="52" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">HR &amp; Payroll Management System — Laravel 12</text>
  <line x1="25" y1="70" x2="575" y2="70" stroke="#334155" stroke-width="1" />

  <!-- Left Sidebar Mock -->
  <rect x="25" y="70" width="120" height="265" fill="#090d16" opacity="0.6" />
  <rect x="40" y="90" width="90" height="18" rx="4" fill="#38bdf8" opacity="0.2" />
  <rect x="40" y="120" width="80" height="12" rx="4" fill="#334155" />
  <rect x="40" y="145" width="70" height="12" rx="4" fill="#334155" />
  <rect x="40" y="170" width="85" height="12" rx="4" fill="#334155" />
  <rect x="40" y="195" width="60" height="12" rx="4" fill="#334155" />

  <!-- Main Content Cards -->
  <g transform="translate(165, 85)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="120" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Total Karyawan</text>
    <text x="12" y="48" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">148 Aktif</text>
    
    <!-- Stat 2 -->
    <rect x="135" y="0" width="120" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="147" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Total Payroll</text>
    <text x="147" y="48" fill="#10b981" font-family="sans-serif" font-size="16" font-weight="bold">Rp 684.5M</text>

    <!-- Stat 3 -->
    <rect x="270" y="0" width="120" height="65" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="282" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Slip Terbit</text>
    <text x="282" y="48" fill="#c084fc" font-family="sans-serif" font-size="16" font-weight="bold">100% PDF</text>

    <!-- Chart & Table Area -->
    <rect x="0" y="80" width="390" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <!-- Bar charts -->
    <rect x="30" y="170" width="24" height="45" rx="4" fill="url(#barGrad)" />
    <rect x="75" y="145" width="24" height="70" rx="4" fill="url(#barGrad)" />
    <rect x="120" y="130" width="24" height="85" rx="4" fill="url(#barGrad)" />
    <rect x="165" y="115" width="24" height="100" rx="4" fill="url(#barGrad)" />
    <rect x="210" y="100" width="24" height="115" rx="4" fill="url(#barGrad)" />
    <rect x="255" y="125" width="24" height="90" rx="4" fill="url(#barGrad)" />

    <!-- Summary Box -->
    <rect x="295" y="95" width="85" height="40" rx="6" fill="#1e293b" />
    <text x="305" y="115" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">Auto Calculate</text>
    <text x="305" y="127" fill="#64748b" font-family="sans-serif" font-size="9">Lembur + BPJS</text>

    <rect x="295" y="145" width="85" height="40" rx="6" fill="#1e293b" />
    <text x="305" y="165" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold">Export PDF</text>
    <text x="305" y="177" fill="#64748b" font-family="sans-serif" font-size="9">Ready to print</text>
  </g>
</svg>
