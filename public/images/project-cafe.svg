<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#cafeBg)" rx="16" />

  <!-- App Window -->
  <rect x="25" y="25" width="550" height="310" rx="12" fill="#292524" stroke="#78350f" stroke-width="1.5" />
  <circle cx="50" cy="48" r="6" fill="#ef4444" />
  <circle cx="68" cy="48" r="6" fill="#f59e0b" />
  <circle cx="86" cy="48" r="6" fill="#10b981" />
  <text x="110" y="52" fill="#fed7aa" font-family="sans-serif" font-size="12" font-weight="600">Café Kopi Rahasia — Smart POS &amp; Order System</text>
  <line x1="25" y1="70" x2="575" y2="70" stroke="#44403c" stroke-width="1" />

  <!-- Menu Grid Left -->
  <g transform="translate(45, 85)">
    <!-- Item 1 -->
    <rect x="0" y="0" width="150" height="105" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <circle cx="35" cy="40" r="20" fill="url(#coffeeGrad)" />
    <!-- Cup icon -->
    <path d="M28 35 L42 35 L40 48 L30 48 Z" fill="#ffffff" />
    <text x="65" y="35" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">Kopi Signature</text>
    <text x="65" y="52" fill="#fbbf24" font-family="sans-serif" font-size="10">Rp 24.000</text>
    <rect x="15" y="72" width="120" height="22" rx="4" fill="#d97706" />
    <text x="75" y="87" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Tambah ke Order</text>

    <!-- Item 2 -->
    <rect x="165" y="0" width="150" height="105" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <circle cx="200" cy="40" r="20" fill="#0284c7" />
    <path d="M193 35 L207 35 L205 48 L195 48 Z" fill="#ffffff" />
    <text x="230" y="35" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">Matcha Latte</text>
    <text x="230" y="52" fill="#fbbf24" font-family="sans-serif" font-size="10">Rp 28.000</text>
    <rect x="180" y="72" width="120" height="22" rx="4" fill="#0284c7" />
    <text x="240" y="87" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Tambah ke Order</text>

    <!-- Item 3 & 4 row 2 -->
    <rect x="0" y="120" width="150" height="105" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <circle cx="35" cy="160" r="20" fill="#e11d48" />
    <text x="65" y="155" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">Croissant Butter</text>
    <text x="65" y="172" fill="#fbbf24" font-family="sans-serif" font-size="10">Rp 22.000</text>
    <rect x="15" y="192" width="120" height="22" rx="4" fill="#e11d48" />
    <text x="75" y="207" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Tambah ke Order</text>

    <rect x="165" y="120" width="150" height="105" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <circle cx="200" cy="160" r="20" fill="#10b981" />
    <text x="230" y="155" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">Manual Brew V60</text>
    <text x="230" y="172" fill="#fbbf24" font-family="sans-serif" font-size="10">Rp 30.000</text>
    <rect x="180" y="192" width="120" height="22" rx="4" fill="#10b981" />
    <text x="240" y="207" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">+ Tambah ke Order</text>
  </g>

  <!-- Bill Receipt Mock Right -->
  <g transform="translate(380, 85)">
    <rect width="175" height="230" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="1" />
    <text x="18" y="28" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">Pesanan Meja #07</text>
    <text x="18" y="44" fill="#a8a29e" font-family="sans-serif" font-size="9">Order ID: #KR-2026-904</text>
    <line x1="15" y1="55" x2="160" y2="55" stroke="#44403c" stroke-width="1" stroke-dasharray="3 3" />
    
    <text x="18" y="75" fill="#e7e5e4" font-family="sans-serif" font-size="10">2x Kopi Signature</text>
    <text x="155" y="75" fill="#e7e5e4" font-family="sans-serif" font-size="10" text-anchor="end">48.000</text>
    <text x="18" y="95" fill="#e7e5e4" font-family="sans-serif" font-size="10">1x Croissant Butter</text>
    <text x="155" y="95" fill="#e7e5e4" font-family="sans-serif" font-size="10" text-anchor="end">22.000</text>
    
    <line x1="15" y1="120" x2="160" y2="120" stroke="#44403c" stroke-width="1" />
    <text x="18" y="140" fill="#a8a29e" font-family="sans-serif" font-size="10">Subtotal</text>
    <text x="155" y="140" fill="#a8a29e" font-family="sans-serif" font-size="10" text-anchor="end">70.000</text>
    <text x="18" y="160" fill="#fef3c7" font-family="sans-serif" font-size="12" font-weight="bold">Total Bayar</text>
    <text x="155" y="160" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Rp 77.000</text>

    <!-- Cetak Struk Button -->
    <rect x="15" y="180" width="145" height="35" rx="6" fill="#d97706" />
    <text x="88" y="202" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cetak Struk Thermal</text>
  </g>
</svg>
